name: Validate PR

on:
  pull_request:
    paths:
      - "sources.json"
      - "data/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: JSON is valid
        run: |
          python -c "import json; json.load(open('sources.json'))"
          python -c "import json; json.load(open('data/torrents.json'))"
          python -c "import json; json.load(open('data/datasets.json'))"
          python -c "import json; json.load(open('data/derivatives.json'))"
          python -c "import json; json.load(open('data/viewers.json'))"
          python -c "import json; json.load(open('.zenodo.json'))"

      - name: Magnets well-formed
        run: |
          python - <<'PY'
          import re, sys
          bad = []
          for i, line in enumerate(open('data/magnets.txt', encoding='utf-8'), 1):
              s = line.strip()
              if not s or s.startswith('#'):
                  continue
              if not s.startswith('magnet:?') or not re.search(r'urn:btih:([0-9a-fA-F]{40}|[2-7A-Za-z]{32})', s):
                  bad.append((i, s[:60]))
          if bad:
              for i, s in bad:
                  print(f"line {i}: malformed magnet: {s}", file=sys.stderr)
              sys.exit(1)
          print("magnets OK")
          PY

      - name: No blobs committed
        run: |
          if git ls-files | grep -iE '\.(pdf|zip|7z|iso|mp4|mov|tar|tar\.gz)$'; then
            echo "Blob files must not be committed — index pointers only." >&2
            exit 1
          fi
          echo "No blobs."

      - name: Index is self-consistent
        run: python scripts/verify.py selftest

      - name: Repo stays small
        run: |
          kb=$(du -sk --exclude=.git . | cut -f1)
          echo "working tree: ${kb} KB"
          if [ "$kb" -gt 5120 ]; then
            echo "Working tree exceeds 5 MB — this index is pointers only." >&2
            exit 1
          fi

      - name: Aggregator runs clean
        run: python scripts/aggregate.py

      - name: Human-facing pages render
        run: python scripts/render_docs.py

      - name: Index still self-consistent after aggregation
        run: python scripts/verify.py selftest
