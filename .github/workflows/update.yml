name: Aggregate & update index

on:
  schedule:
    - cron: "17 6 * * *"   # daily 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "sources.json"
      - "scripts/aggregate.py"
      - "data/**"

permissions:
  contents: write

concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run aggregator
        run: python scripts/aggregate.py

      - name: Commit changes if any
        run: |
          git config user.name  "epstein-files-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/ MANIFEST.md)" ]; then
            git add data/ MANIFEST.md
            git commit -m "chore(data): auto-update aggregated index [skip ci]"
            git push
          else
            echo "No changes."
          fi
